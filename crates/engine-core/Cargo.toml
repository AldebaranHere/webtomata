[package]
name = "engine-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
roxmltree = "=0.21.1"
# Only for generating the TypeScript types (`cargo test --features ts`); never in the WASM build.
ts-rs = { version = "=12.0.1", optional = true, default-features = false, features = ["serde-compat", "no-serde-warnings"] }

[features]
ts = ["dep:ts-rs"]

[dev-dependencies]
proptest = "=1.11.0"

[lints]
workspace = true
