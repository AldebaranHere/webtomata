  <rect width="960" height="470" fill="#ffffff"/>
  <g fill="none" stroke="#9ca3af" stroke-width="1">
    <!-- panel 1: now -->
    <rect x="20" y="60" width="290" height="210" rx="8"/>
    <rect x="30" y="84" width="48" height="20" fill="#f3f4f6"/>
    <rect x="105" y="86" width="34" height="17"/><rect x="152" y="86" width="34" height="17"/><rect x="199" y="86" width="34" height="17"/>
    <rect x="240" y="85" width="18" height="18" stroke-dasharray="3 2"/>
    <rect x="30" y="124" width="48" height="20" fill="#f3f4f6"/>
    <rect x="105" y="126" width="34" height="17"/><rect x="152" y="126" width="34" height="17"/>
    <rect x="240" y="125" width="18" height="18" stroke-dasharray="3 2"/>
    <rect x="30" y="166" width="17" height="15"/><rect x="52" y="166" width="17" height="15"/><rect x="74" y="166" width="17" height="15"/>
    <rect x="30" y="225" width="80" height="20"/>
    <rect x="270" y="84" width="33" height="33" stroke="#b45309" stroke-dasharray="4 3"/>
    <!-- panel 2: proposal A -->
    <rect x="335" y="60" width="290" height="335" rx="8"/>
    <rect x="345" y="72" width="54" height="33" fill="#f3f4f6"/>
    <rect x="582" y="72" width="33" height="33" stroke="#2563eb"/>
    <rect x="345" y="112" width="270" height="33"/><rect x="345" y="150" width="270" height="33"/><rect x="345" y="188" width="270" height="33"/>
    <rect x="345" y="226" width="270" height="33" stroke="#2563eb" stroke-dasharray="4 3"/>
    <rect x="345" y="266" width="33" height="33"/><rect x="383" y="266" width="33" height="33"/><rect x="421" y="266" width="33" height="33"/>
    <line x1="335" y1="308" x2="625" y2="308"/>
    <rect x="345" y="316" width="54" height="33" fill="#f3f4f6"/>
    <rect x="582" y="316" width="33" height="33" stroke="#2563eb"/>
    <rect x="345" y="356" width="270" height="33"/>
    <rect x="335" y="405" width="290" height="33" rx="4" stroke="#2563eb"/>
    <!-- panel 3: proposal B -->
    <rect x="650" y="60" width="290" height="290" rx="8"/>
    <rect x="660" y="72" width="54" height="33" fill="#f3f4f6"/>
    <rect x="897" y="72" width="33" height="33" stroke="#2563eb"/>
    <rect x="660" y="112" width="70" height="33"/><rect x="755" y="112" width="50" height="33"/><rect x="830" y="112" width="50" height="33"/>
    <rect x="660" y="150" width="70" height="33"/>
    <rect x="745" y="150" width="33" height="33" stroke="#2563eb" stroke-dasharray="4 3"/>
    <rect x="660" y="190" width="33" height="33"/><rect x="698" y="190" width="33" height="33"/><rect x="736" y="190" width="33" height="33"/>
    <line x1="650" y1="232" x2="940" y2="232"/>
    <rect x="660" y="240" width="54" height="33" fill="#f3f4f6"/>
    <rect x="897" y="240" width="33" height="33" stroke="#2563eb"/>
    <rect x="660" y="280" width="70" height="33"/>
    <rect x="650" y="360" width="290" height="33" rx="4" stroke="#2563eb"/>
  </g>
  <g fill="#1f2937">
    <text x="20" y="30" font-size="14" font-weight="600">Sekarang (HP, 360 px)</text>
    <text x="335" y="30" font-size="14" font-weight="600">Usulan A: alternatif bertumpuk</text>
    <text x="650" y="30" font-size="14" font-weight="600">Usulan B: alternatif mengalir</text>
    <text x="20" y="48" fill="#6b7280">Kotak digambar 0,75 kali ukuran asli. Kotak putus-putus oranye = 44 × 44 px.</text>
    <!-- panel 1 text -->
    <text x="48" y="99" text-anchor="middle" font-weight="700">S</text><text x="88" y="99">→</text>
    <text x="122" y="99" text-anchor="middle">A</text><text x="145" y="99">|</text><text x="169" y="99" text-anchor="middle">B</text><text x="192" y="99">|</text><text x="216" y="99" text-anchor="middle">ε</text><text x="249" y="99" text-anchor="middle">+</text>
    <text x="48" y="139" text-anchor="middle" font-weight="700">A</text><text x="88" y="139">→</text><text x="122" y="139" text-anchor="middle">a</text><text x="145" y="139">|</text><text x="169" y="139" text-anchor="middle">b</text><text x="249" y="139" text-anchor="middle">+</text>
    <text x="30" y="160" fill="#6b7280" font-size="10">simbol: tinggi 20 px</text>
    <text x="30" y="205" fill="#6b7280" font-size="10">Hapus baris: hanya klik kanan.</text>
    <text x="30" y="217" fill="#6b7280" font-size="10">Tidak ada tombol di layar sentuh.</text>
    <text x="70" y="239">+ Tambah Baris</text>
    <text x="30" y="260" fill="#b45309" font-size="10">LHS 64×26 · alternatif 45×22 · + 24×24</text>
    <text x="286" y="104" fill="#b45309" text-anchor="middle" font-size="9">44</text>
    <!-- panel 2 text -->
    <text x="372" y="94" text-anchor="middle" font-weight="700">S</text><text x="412" y="94">→</text><text x="598" y="94" text-anchor="middle" font-size="16">×</text>
    <text x="355" y="133">A B</text><text x="355" y="171">a</text><text x="355" y="209">ε</text>
    <text x="480" y="247" text-anchor="middle" fill="#2563eb">+ Alternatif</text>
    <text x="361" y="287" text-anchor="middle">ε</text><text x="399" y="287" text-anchor="middle">|</text><text x="437" y="287" text-anchor="middle">→</text>
    <text x="470" y="287" fill="#6b7280" font-size="10">simbol 44 × 44</text>
    <text x="372" y="338" text-anchor="middle" font-weight="700">A</text><text x="412" y="338">→</text><text x="598" y="338" text-anchor="middle" font-size="16">×</text><text x="355" y="377">a A</text>
    <text x="480" y="426" text-anchor="middle" fill="#2563eb">+ Tambah Baris</text>
    <text x="335" y="455" fill="#6b7280" font-size="10">Tiap aturan = satu kartu. Tombol × 44 × 44 menghapus kartu.</text>
    <!-- panel 3 text -->
    <text x="687" y="94" text-anchor="middle" font-weight="700">S</text><text x="727" y="94">→</text><text x="913" y="94" text-anchor="middle" font-size="16">×</text>
    <text x="670" y="133">A B</text><text x="738" y="133">|</text><text x="780" y="133" text-anchor="middle">a</text><text x="813" y="133">|</text><text x="855" y="133" text-anchor="middle">ε</text><text x="670" y="171">b c</text><text x="761" y="171" text-anchor="middle" fill="#2563eb">+</text>
    <text x="676" y="211" text-anchor="middle">ε</text><text x="714" y="211" text-anchor="middle">|</text><text x="752" y="211" text-anchor="middle">→</text>
    <text x="687" y="262" text-anchor="middle" font-weight="700">A</text><text x="727" y="262">→</text><text x="913" y="262" text-anchor="middle" font-size="16">×</text><text x="670" y="301">a A</text>
    <text x="795" y="381" text-anchor="middle" fill="#2563eb">+ Tambah Baris</text>
    <text x="650" y="410" fill="#6b7280" font-size="10">Alternatif tetap berderet seperti di buku:</text>
    <text x="650" y="423" fill="#6b7280" font-size="10">S → A B | a | ε. Tinggi 44 px, lebar minimal 64 px.</text>
  </g>
</svg>
