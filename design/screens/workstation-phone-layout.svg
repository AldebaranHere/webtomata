<svg xmlns="http://www.w3.org/2000/svg" width="680" height="650" viewBox="0 0 680 650" role="img">
  <title>Proposed phone layout of the grammar and language workstations</title>
  <desc>Two rows of phone screens. The first row shows the grammar workstation with the tabs Pustaka, Editor, CNF and CYK, one area at a time. The second row shows the language workstation with the tabs Pustaka, Editor and Hasil.</desc>
