<svg xmlns="http://www.w3.org/2000/svg" width="680" height="230" viewBox="0 0 680 230" role="img">
  <title>Start state marker: now and proposed</title>
  <desc>Three states named q0. The first has the old short arrow with the word mulai. The second, the approved one, has a large hollow triangle with the word mulai. The third has only the triangle.</desc>
  <rect width="680" height="230" fill="#f6f7f9"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#3b414c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="monospace" font-size="12" fill="#3b414c">
    <line x1="88" y1="95" x2="127" y2="95" stroke="#3b414c" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="82" y="95" text-anchor="end" dominant-baseline="central">mulai</text>
    <circle cx="160" cy="95" r="32" fill="#ffffff" stroke="#3b414c" stroke-width="1.5"/>
    <text x="160" y="95" text-anchor="middle" dominant-baseline="central" font-size="16">q0</text>
    <text x="130" y="165" text-anchor="middle" font-family="sans-serif" font-size="14">Old (not used)</text>

    <polygon points="358,95 330,77 330,113" fill="#ffffff" stroke="#3b414c" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="324" y="95" text-anchor="end" dominant-baseline="central">mulai</text>
    <circle cx="390" cy="95" r="32" fill="#ffffff" stroke="#3b414c" stroke-width="1.5"/>
    <text x="390" y="95" text-anchor="middle" dominant-baseline="central" font-size="16">q0</text>
    <text x="360" y="165" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold">Approved: triangle with label</text>
    <text x="360" y="185" text-anchor="middle" font-family="sans-serif" font-size="12">28 long, 36 wide, tip on the rim</text>

    <polygon points="568,95 540,77 540,113" fill="#ffffff" stroke="#3b414c" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="600" cy="95" r="32" fill="#ffffff" stroke="#3b414c" stroke-width="1.5"/>
    <text x="600" y="95" text-anchor="middle" dominant-baseline="central" font-size="16">q0</text>
    <text x="570" y="165" text-anchor="middle" font-family="sans-serif" font-size="14">Not chosen: triangle only</text>
  </g>
</svg>
