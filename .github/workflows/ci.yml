name: CI

# One run for each pull request, and one for each push to main and staging (after a merge). A push
# to dev-initial is covered by the run of its pull request, so it does not start a second one.
on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# The ruleset requires two checks: `rust` and `web`. The work that `web` used to do is split over
# parallel jobs (checks, e2e, lighthouse and cross-browser), and `web` at the end is a gate that is
# green only if every one of them is (docs/decisions/0027). So the ruleset never changes when a job
# is added: tools/check-workflows.mjs makes sure that `web` waits for every job of this file.
jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check changed paths
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Push to main is never docs-only: production always runs full CI
          if [ "$REF_NAME" = "main" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE=""
          HEAD=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
            HEAD="$PR_HEAD_SHA"
          elif [ "$EVENT_NAME" = "push" ]; then
            if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
              BASE="$PUSH_BEFORE"
              HEAD="$PUSH_SHA"
            fi
          fi

          if [ -z "$BASE" ] || [ -z "$HEAD" ]; then
            echo "Cannot determine diff range; falling back to full CI."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Diffing $BASE ... $HEAD"
          DOCS_ONLY="false"
          if git cat-file -e "$BASE" 2>/dev/null && git cat-file -e "$HEAD" 2>/dev/null; then
            if RESULT=$(git diff --no-renames --name-only -z "$BASE" "$HEAD" | node tools/docs-only.mjs 2>/dev/null); then
              if [ "$RESULT" = "true" ]; then
                DOCS_ONLY="true"
              fi
            fi
          else
            echo "Commits not found in local clone; falling back to full CI."
          fi

          echo "docs_only=$DOCS_ONLY"
          echo "docs_only=$DOCS_ONLY" >> "$GITHUB_OUTPUT"

  rust:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Runs each benchmark case once, so that the benchmarks cannot break unnoticed.
      - run: cargo test -p engine-core --benches

  # The checks that need no browser: the tests, the linters and the guard rails, and the production
  # build with its size budgets and the smoke test.
  checks:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main' }}
      - run: cargo install wasm-pack --locked
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:wasm
      - run: pnpm build:wasm
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm test:web
      - run: pnpm test:tools
      # The Cloudflare key stays in one job; every action is pinned (docs/decisions/0015).
      - run: pnpm check:workflows
      # Design tokens: every color pair passes WCAG AA, and components use no raw colors.
      - run: pnpm check:contrast
      - run: pnpm check:tokens
      # Every user-facing string is a message (no hard-coded text in components).
      - run: pnpm check:strings
      # Question files: the shape, and the solution against the engine (needs the WASM built above).
      - run: pnpm check:questions
      - run: pnpm --filter web build
      - run: pnpm size
      # Opens the production build in headless Chrome and checks that the app runs.
      - run: pnpm smoke

  # Browser tests on the production build: the engine version loads, the editor flows work, and axe
  # finds no accessibility violation (docs/decisions/0018-playwright.md). Uses the Chrome of the
  # runner. The tests are split over four computers; every test runs in exactly one of them.
  e2e:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main' }}
      - run: cargo install wasm-pack --locked
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:wasm
      - run: pnpm --filter web build
      - run: pnpm --filter web test:e2e --shard=${{ matrix.shard }}/4

  # The performance, accessibility, best-practices and SEO scores of the budgets (CLAUDE.md, section 7).
  lighthouse:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main' }}
      - run: cargo install wasm-pack --locked
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:wasm
      - run: pnpm --filter web build
      # A hung Lighthouse run is stopped and tried once more by the check itself (a minute each); this
      # limit is only a net under it. The step takes about 2 minutes.
      - run: pnpm lighthouse
        timeout-minutes: 8

  # The small set of browser tests in Firefox and in WebKit (an iPhone), next to the Chrome tests
  # of the job e2e (docs/decisions/0022-cross-browser-tests.md). It has no secrets and read-only
  # rights. One computer for each browser, so that each one downloads only its own system libraries.
  # The browser is downloaded by Playwright, at the exact version of the lockfile.
  cross-browser:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: firefox
            project: firefox
          - browser: webkit
            project: webkit-phone
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main' }}
      - run: cargo install wasm-pack --locked
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:wasm
      - run: pnpm --filter web build
      # The browsers are restored in every run, and saved only after a run on staging or main: a cache
      # that a pull request saves can only be used by that pull request (docs/decisions/0027).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter web exec playwright install ${{ matrix.browser }}
        if: steps.browsers.outputs.cache-hit != 'true'
        timeout-minutes: 5
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.browsers.outputs.cache-hit != 'true' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('pnpm-lock.yaml') }}
      # The system libraries come from the Ubuntu mirror of the runner (azure.archive.ubuntu.com).
      # Sometimes that mirror is so slow, without hanging, that `playwright install-deps` takes 6
      # minutes or more (8 to 36 minutes in some runs, against 30 seconds normally), and it has no
      # time limit. tools/install-browser-deps.sh runs apt itself under a hard limit, up to three
      # tries of 300 seconds each, and uses the main archive from the second try on.
      - name: Install the system libraries of the browser
        timeout-minutes: 15
        run: bash tools/install-browser-deps.sh ${{ matrix.browser }}
      - run: pnpm --filter web exec playwright test --project=${{ matrix.project }}

  # The gate. The ruleset requires this check by its name, `web`. It runs also when a job before it
  # failed or was cancelled (`if: always()`), because a skipped required check counts as passed, and
  # it is green only if every job before it is green (or legitimately skipped for docs-only PRs).
  web:
    if: always()
    needs: [scope, checks, e2e, lighthouse, cross-browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Evaluate gate
        env:
          DOCS_ONLY: ${{ needs.scope.outputs.docs_only }}
          NEEDS_JSON: ${{ toJson(needs) }}
        run: node tools/ci-gate.mjs
