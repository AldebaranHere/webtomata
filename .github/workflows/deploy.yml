name: Deploy

# Production: every push to main. Preview: every pull request from this repository.
# Fork PRs get no secrets, so they skip the upload.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Production deploys must never overlap or be cancelled half way.
    concurrency:
      group: ${{ github.event_name == 'push' && 'deploy-production' || format('deploy-preview-{0}', github.ref) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The Cloudflare secrets are set only on the steps that need them, never on
      # third-party actions or on dependency installs.
      - name: Check Cloudflare secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "Cloudflare secrets not available (fork PR or not configured yet); skipping."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.secrets.outputs.present == 'true'
        with:
          persist-credentials: false
      - if: steps.secrets.outputs.present == 'true'
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.secrets.outputs.present == 'true'
      - if: steps.secrets.outputs.present == 'true'
        run: cargo install wasm-pack --locked
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.secrets.outputs.present == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.secrets.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.secrets.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.secrets.outputs.present == 'true'
        run: pnpm build

      - name: Deploy to production
        if: steps.secrets.outputs.present == 'true' && github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm --filter web exec wrangler deploy --message "$GITHUB_SHA" | tee deploy.log
          url=$(grep -o 'https://[a-z0-9.-]*\.workers\.dev' deploy.log | head -n 1)
          echo "Deployed to $url"
          # A new version can take a few seconds to reach every edge, so retry.
          for attempt in 1 2 3 4 5 6; do
            node tools/check-headers.mjs "$url/" && exit 0
            echo "Header check failed (attempt $attempt); retrying in 5s"
            sleep 5
          done
          exit 1

      - name: Upload preview
        if: steps.secrets.outputs.present == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Previews need an existing Worker; the first production deploy creates it.
          if ! pnpm --filter web exec wrangler deployments list; then
            echo "No production deployment yet; skipping preview."
            exit 0
          fi
          pnpm --filter web exec wrangler versions upload --preview-alias "pr-$PR" --message "PR $PR $GITHUB_SHA" | tee preview.log
          url=$(grep -o 'https://pr-[a-z0-9.-]*\.workers\.dev' preview.log | head -n 1)
          if [ -n "$url" ]; then
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "Preview: $url (commit ${GITHUB_SHA::7})"
          fi
