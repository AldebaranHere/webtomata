name: Audit

# Known vulnerabilities in our dependencies. Not a required check: a new advisory must not block
# an unrelated pull request, so this runs weekly, when a lockfile changes, and by hand.
on:
  pull_request:
    paths:
      - "Cargo.lock"
      - "fuzz/Cargo.lock"
      - "pnpm-lock.yaml"
      - ".github/workflows/audit.yml"
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install cargo-audit --locked --version 0.22.2
      # The advisory database comes from the RustSec repository. Accepted advisories, with their
      # reasons and dates, are in .cargo/audit.toml.
      - run: cargo audit
      - run: cargo audit --file fuzz/Cargo.lock

  pnpm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Sends the names and versions of our packages to the npm registry, as an install does.
      # Accepted advisories, with their reasons and dates, are in pnpm-workspace.yaml.
      - run: pnpm audit
