name: Clean caches

# A cache that a pull request saves can only be used by that pull request, so it is only waste after
# the pull request is closed, and the caches of a repository share 10 GB: past that, GitHub deletes
# the caches that were used least recently, which can be the ones of staging and main that every
# run needs (docs/decisions/0027). The `cleanup` job deletes the caches of a pull request when it
# closes; the `prune` job runs daily (or by hand) to delete superseded caches of staging and main
# (docs/decisions/0068).
on:
  pull_request:
    types: [closed]
  schedule:
    # Daily at 03:17 UTC (off-peak minute, not :00).
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List caches that would be deleted without deleting them'
        type: boolean
        default: true

# The only workflow that may write to the Actions of the repository (caches).
permissions:
  actions: write

jobs:
  cleanup:
    # A pull request from a fork has a token that cannot delete anything.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Delete the caches of this pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          ids="$(gh cache list --ref "$REF" --limit 100 --json id --jq '.[].id')"
          for id in $ids; do
            gh cache delete "$id"
          done
          echo "Deleted $(echo "$ids" | grep -c . || true) caches of $REF."

  prune:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Prune superseded caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node tools/prune-caches.mjs --dry-run
          else
            node tools/prune-caches.mjs
          fi
