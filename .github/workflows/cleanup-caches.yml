name: Clean caches

# A cache that a pull request saves can only be used by that pull request, so it is only waste after
# the pull request is closed, and the caches of a repository share 10 GB: past that, GitHub deletes
# the caches that were used least recently, which can be the ones of staging and main that every
# run needs (docs/decisions/0027). This deletes the caches of a pull request when it closes.
on:
  pull_request:
    types: [closed]

# The only workflow that may write to the Actions of the repository (caches).
permissions:
  actions: write

jobs:
  cleanup:
    # A pull request from a fork has a token that cannot delete anything.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Delete the caches of this pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          ids="$(gh cache list --ref "$REF" --limit 100 --json id --jq '.[].id')"
          for id in $ids; do
            gh cache delete "$id"
          done
          echo "Deleted $(echo "$ids" | grep -c . || true) caches of $REF."
