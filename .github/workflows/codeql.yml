name: CodeQL

# Code scanning: GitHub's own analysis looks for known kinds of mistakes in our TypeScript and Rust
# (injection, unsafe handling of input, and so on). Not a required check: a new finding must not
# block an unrelated pull request, so it runs on pull requests, on a push to main or staging, weekly,
# and by hand. It reads the source only (no build), and it is free for a public repository.
# A change that touches only documents cannot change a finding, so the push trigger skips the same
# paths as the pull request trigger (tools/check-workflows.mjs keeps the two lists equal to the
# docs-only allowlist); the weekly run and the manual run still scan the branch.
on:
  pull_request:
    branches: [main, staging]
    paths-ignore:
      - 'docs/**'
      - 'design/**'
      - '.antigravity/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'LICENSE'
  push:
    branches: [main, staging]
    paths-ignore:
      - 'docs/**'
      - 'design/**'
      - '.antigravity/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'LICENSE'
  schedule:
    - cron: "17 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same pull request cancels the scan that is still running for it. A push to main
# or staging is never cancelled: that scan is the baseline that later pull requests are compared to.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:${{ matrix.language }}"
